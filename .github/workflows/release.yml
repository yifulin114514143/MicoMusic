name: MicoMusic 手动构建验证（暂不发布）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: 构建并保存测试产物
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: 检出源码及 API 子模块
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: 准备 Node.js 运行环境
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖并执行验证
        run: |
          npm run install-all
          npm run test:identity
          npm run build
      - name: 本地构建（禁止发布）
        env:
          os: ${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'macos' || 'linux' }}
        run: npm run electron:build:${{ env.os }}
      - name: 保存测试产物
        uses: actions/upload-artifact@v4
        with:
          name: MicoMusic-${{ runner.os }}-测试产物
          retention-days: 7
          if-no-files-found: error
          path: |
            dist_electron/*.exe
            dist_electron/*.zip
            dist_electron/*.dmg
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.blockmap
            dist_electron/latest*.yml
